<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Snack Feed - Recipe Box</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container py-5">
      <section class="mb-5">
        <h2>Find a Recipe</h2>
        <input
          type="number"
          id="recipe-id"
          class="form-control"
          value="1"
          min="1"
        />
        <button id="get-btn" class="btn btn-dark">Get Recipe</button>
        <p id="status" class="fw-bold text-danger"></p>
        <div id="recipe"></div>
      </section>

      <section>
        <h2>Add a Dish</h2>
        <input
          id="dish-name"
          type="text"
          class="form-control"
          placeholder="New dish name"
        />
        <button id="post-btn" class="btn btn-dark">Add a Dish</button>
        <p id="post-status"></p>
        <div id="saved"></div>

        <h3>My added dishes</h3>
        <ul id="my-dishes"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
